apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.familyboard.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.familyboard.app"
        minSdk 24
        targetSdk 34
        versionCode (System.getenv("ANDROID_VERSION_CODE") ? System.getenv("ANDROID_VERSION_CODE").toInteger() : 1)
        versionName (System.getenv("ANDROID_VERSION_NAME") ?: "1.0.0")
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("FAMILYBOARD_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("FAMILYBOARD_KEYSTORE_PASSWORD")
                keyAlias System.getenv("FAMILYBOARD_KEY_ALIAS")
                keyPassword System.getenv("FAMILYBOARD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("FAMILYBOARD_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
}
