<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Mark "Cercles" validé en Phase A (artefacts Splash + Design System) — violet/corail,
       remplace l'ancien marine/or. Cluster de 4 cercles dans la zone de sécurité "maskable"
       (cercle Ø80% centré) : rien n'est rogné par un launcher Android qui masque l'icône. -->
  <defs>
    <linearGradient id="fbMarkGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8F72FF"/>
      <stop offset="100%" stop-color="#FF6B5B"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#fbMarkGradient)"/>
  <g fill="#fff" fill-opacity=".95">
    <circle cx="40" cy="58" r="17"/>
    <circle cx="62" cy="62" r="13"/>
    <circle cx="66" cy="40" r="9"/>
    <circle cx="48" cy="34" r="7"/>
  </g>
</svg>
