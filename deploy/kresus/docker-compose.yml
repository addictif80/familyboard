# Une instance Kresus par membre de la famille (Kresus ne gère pas nativement
# plusieurs utilisateurs isolés dans une seule instance — voir README.md).
#
# Kresus (>= 0.20) exige une base PostgreSQL déclarée explicitement (pas de
# base embarquée par défaut). Un seul serveur Postgres partagé suffit : chaque
# membre a sa propre base de données à l'intérieur (isolation des données),
# voir README.md "Ajouter un membre" pour créer une base supplémentaire.
#
# La configuration passe par les variables d'environnement KRESUS_DB_* (plus
# fiable que le fichier config.ini avec l'image bnjbvr/kresus).
#
# ⚠️ Change "changeme-postgres" (2 occurrences ci-dessous, même valeur) avant
# le premier démarrage.
#
# Pour ajouter un membre : dupliquer le bloc "kresus-<prenom>", changer le nom
# du service/container, le port hôte exposé (127.0.0.1:987X), les dossiers de
# données, et créer sa base Postgres dédiée (voir README.md).
#
# Utilisation :
#   docker compose up -d
#
# Les ports Kresus ne sont exposés que sur 127.0.0.1 : ils ne sont accessibles
# que via le reverse-proxy OpenLiteSpeed configuré dans CyberPanel (voir
# README.md), jamais directement depuis Internet. Postgres n'est pas exposé
# du tout (accessible uniquement depuis les autres conteneurs de ce fichier).

services:
  kresus-db:
    image: postgres:16-alpine
    container_name: kresus-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=kresus
      - POSTGRES_USER=kresus
      - POSTGRES_PASSWORD=changeme-postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  kresus:
    image: bnjbvr/kresus
    container_name: kresus
    restart: unless-stopped
    depends_on:
      - kresus-db
    ports:
      - "127.0.0.1:9871:9876"
    environment:
      - LOCAL_USER_ID=1000
      - KRESUS_PORT=9876
      - KRESUS_DB_TYPE=postgres
      - KRESUS_DB_HOST=kresus-db
      - KRESUS_DB_PORT=5432
      - KRESUS_DB_USERNAME=kresus
      - KRESUS_DB_PASSWORD=changeme-postgres
      - KRESUS_DB_NAME=kresus
    volumes:
      - ./data/kresus:/home/user/data
      - ./woob/kresus:/woob
      - /etc/localtime:/etc/localtime:ro

  # kresus-<nouveau-membre>:
  #   image: bnjbvr/kresus
  #   container_name: kresus-<nouveau-membre>
  #   restart: unless-stopped
  #   depends_on:
  #     - kresus-db
  #   ports:
  #     - "127.0.0.1:9872:9876"
  #   environment:
  #     - LOCAL_USER_ID=1000
  #     - KRESUS_PORT=9876
  #     - KRESUS_DB_TYPE=postgres
  #     - KRESUS_DB_HOST=kresus-db
  #     - KRESUS_DB_PORT=5432
  #     - KRESUS_DB_USERNAME=kresus
  #     - KRESUS_DB_PASSWORD=changeme-postgres
  #     - KRESUS_DB_NAME=kresus_<nouveau-membre>
  #   volumes:
  #     - ./data/<nouveau-membre>:/home/user/data
  #     - ./woob/<nouveau-membre>:/woob
  #     - /etc/localtime:/etc/localtime:ro
